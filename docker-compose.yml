services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS:-968500846}
      # Ключ шифрования VK-токенов. Если задан — используется вместо data/token.key.
      # Менять после того, как токены уже зашифрованы, нельзя (расшифровка сломается).
      - TOKEN_KEY=${TOKEN_KEY:-}
      - VK_PUBLISH_CONCURRENCY=${VK_PUBLISH_CONCURRENCY:-1}
      - VK_PUBLISH_RETRIES=${VK_PUBLISH_RETRIES:-3}
      - VK_RETRY_BASE_DELAY=${VK_RETRY_BASE_DELAY:-3}
      - PUBLISH_WINDOW_START_HOUR=${PUBLISH_WINDOW_START_HOUR:-9}
      - PUBLISH_WINDOW_END_HOUR=${PUBLISH_WINDOW_END_HOUR:-22}
      - DAILY_PLAN_HOUR=${DAILY_PLAN_HOUR:-0}
      - DAILY_PLAN_MINUTE=${DAILY_PLAN_MINUTE:-5}
      - ERROR_RETENTION_DAYS=${ERROR_RETENTION_DAYS:-5}
      - ERROR_CLEANUP_INTERVAL_DAYS=${ERROR_CLEANUP_INTERVAL_DAYS:-5}
      # YouTube-источники. Из России YouTube заблокирован — нужен зарубежный прокси.
      # Куки кладутся в ./data/youtube_cookies.txt и подхватываются сами.
      - YOUTUBE_PROXY=${YOUTUBE_PROXY:-}
      # Полноценные ролики YouTube (не шортсы): лимит длительности, сек (пусто или 0 —
      # без лимита), и потолок качества.
      - YOUTUBE_VIDEO_MAX_DURATION=${YOUTUBE_VIDEO_MAX_DURATION:-}
      - YOUTUBE_VIDEO_MAX_HEIGHT=${YOUTUBE_VIDEO_MAX_HEIGHT:-1080}
      # Ежедневный снимок подписчиков всех групп для /metrics (МСК).
      - METRICS_HOUR=${METRICS_HOUR:-23}
      - METRICS_MINUTE=${METRICS_MINUTE:-50}
    volumes:
      - ./data:/app/data
      # Базы парсера должны быть доступны боту по тем же путям, что указаны в
      # источниках. Смонтируй папку с базами парсера сюда (пример):
      # - C:/Users/androed/Desktop/парсер:/parser:ro
